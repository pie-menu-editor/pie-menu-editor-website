<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Continue to the dedicated Pie Menu Editor Fork setup page.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <link rel="canonical" href="https://pie-menu-editor.com/setup/">
  <title>Set up PME-F</title>
  <style>
    :root {
      color-scheme: light;
      --background: #cbcbc7;
      --text: #181818;
      --muted: #525250;
      --line: #bdbdb8;
      --accent-hover: #842731;
      --link: #171c52;
      --content-width: 680px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      background:
        radial-gradient(circle at 50% 12%, #fdfdfb 0, #f1f1ee 23rem, #e2e2de 45rem, transparent 69rem),
        var(--background);
      color: var(--text);
    }

    body { min-height: 100vh; margin: 0; }

    a {
      color: var(--link);
      text-decoration-color: currentcolor;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.2em;
    }

    a:hover { color: var(--accent-hover); }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }

    .wrap {
      width: min(calc(100% - 2.5rem), var(--content-width));
      margin-inline: auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgb(255 255 255 / 18%);
    }

    header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 3.75rem;
      gap: 1rem;
    }

    .brand { color: var(--text); font-weight: 700; text-decoration: none; }
    main { padding-block: clamp(2.5rem, 6vw, 4rem); }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.1; }
    p { max-width: 620px; color: var(--muted); }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.8rem;
      margin-top: 1rem;
      padding: 0.65rem 1rem;
      border: 1px solid var(--text);
      border-radius: 0.2rem;
      background: var(--text);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover { background: #343434; color: #fff; }

    footer {
      padding-block: 2rem 3rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/">PME-F</a>
      <a href="mailto:Support@pie-menu-editor.com">Support</a>
    </div>
  </header>

  <main class="wrap">
    <h1>Set up PME-F</h1>
    <p>
      Purchase verification and Repository credentials are handled on a separate,
      single-purpose setup page.
    </p>
    <a class="button" href="https://setup.pie-menu-editor.com/" rel="noreferrer">Continue to setup</a>
  </main>

  <footer>
    <div class="wrap">No purchase information is entered or stored on this page.</div>
  </footer>
</body>
</html>
